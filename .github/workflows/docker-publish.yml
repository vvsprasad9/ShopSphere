name: Docker Build & GHCR Publish

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # =================================================================
  # Pre-requisite Quality Gates: Run backend & frontend test suites
  # =================================================================
  test-backend:
    name: Backend Test Quality Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shopsphere/backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Execute Backend Tests & Package SBOM
        run: mvn clean verify -B

      - name: Upload Backend CycloneDX SBOM
        uses: actions/upload-artifact@v4
        with:
          name: backend-cyclonedx-sbom
          path: shopsphere/backend/target/classes/META-INF/sbom/application.cdx.json
          if-no-files-found: ignore
          retention-days: 30

  test-frontend:
    name: Frontend Test Quality Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shopsphere/frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: shopsphere/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Execute Frontend Tests
        run: npm test

      - name: Execute Frontend Production Build
        run: npm run build

  # =================================================================
  # Step 1: Build & Publish Candidate Spring Boot Backend Docker Image
  # Immutable commit SHA candidate image only; 'latest' is NOT pushed here
  # =================================================================
  build-and-push-backend:
    name: Build & Publish Backend Candidate Image
    needs: test-backend
    runs-on: ubuntu-latest
    outputs:
      image_name: ${{ steps.repo-info.outputs.image_name }}
      digest: ${{ steps.build-backend.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve Lowercase Repository Name
        id: repo-info
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image_name=ghcr.io/${OWNER_LC}/shopsphere-backend" >> $GITHUB_OUTPUT

      - name: Extract Docker Metadata for Backend (Candidate Tag Only)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.repo-info.outputs.image_name }}
          tags: |
            type=sha,prefix=sha-,format=short

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend Candidate Image
        id: build-backend
        uses: docker/build-push-action@v6
        with:
          context: ./shopsphere/backend
          file: ./shopsphere/backend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =================================================================
  # Step 2: Build & Publish Candidate React + Nginx Frontend Docker Image
  # Immutable commit SHA candidate image only; 'latest' is NOT pushed here
  # =================================================================
  build-and-push-frontend:
    name: Build & Publish Frontend Candidate Image
    needs: test-frontend
    runs-on: ubuntu-latest
    outputs:
      image_name: ${{ steps.repo-info.outputs.image_name }}
      digest: ${{ steps.build-frontend.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve Lowercase Repository Name
        id: repo-info
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image_name=ghcr.io/${OWNER_LC}/shopsphere-frontend" >> $GITHUB_OUTPUT

      - name: Extract Docker Metadata for Frontend (Candidate Tag Only)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.repo-info.outputs.image_name }}
          tags: |
            type=sha,prefix=sha-,format=short

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Frontend Candidate Image
        id: build-frontend
        uses: docker/build-push-action@v6
        with:
          context: ./shopsphere/frontend
          file: ./shopsphere/frontend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =================================================================
  # Step 3: Security Vulnerability Scan & Dual Reporting (Trivy Gate)
  # Scans exact candidate image digests. Blocks promotion on policy failure.
  # =================================================================
  security-scan:
    name: Container Vulnerability Scan & Dual Reporting
    needs: [build-and-push-backend, build-and-push-frontend]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Candidate Image Digests
        id: digest-info
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          BACKEND_CANDIDATE="${{ needs.build-and-push-backend.outputs.image_name }}@${{ needs.build-and-push-backend.outputs.digest }}"
          FRONTEND_CANDIDATE="${{ needs.build-and-push-frontend.outputs.image_name }}@${{ needs.build-and-push-frontend.outputs.digest }}"
          echo "backend_candidate=${BACKEND_CANDIDATE}" >> $GITHUB_OUTPUT
          echo "frontend_candidate=${FRONTEND_CANDIDATE}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT

      # -------------------------------------------------------------
      # 1. Unfiltered Vulnerability Scans (Full visibility without .trivyignore)
      # -------------------------------------------------------------
      - name: Unfiltered Vulnerability Scan — Backend Image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.digest-info.outputs.backend_candidate }}
          format: 'table'
          output: 'unfiltered-backend-report.txt'
          exit-code: '0'
          trivy-options: '--ignorefile /dev/null'
          ignore-unfixed: false
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Unfiltered Vulnerability Scan — Frontend Image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.digest-info.outputs.frontend_candidate }}
          format: 'table'
          output: 'unfiltered-frontend-report.txt'
          exit-code: '0'
          trivy-options: '--ignorefile /dev/null'
          ignore-unfixed: false
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      # -------------------------------------------------------------
      # 2. Policy-Filtered Vulnerability Scans (Enforcing Gate with .trivyignore)
      # -------------------------------------------------------------
      - name: Policy-Filtered Vulnerability Gate — Backend Image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.digest-info.outputs.backend_candidate }}
          format: 'table'
          output: 'policy-filtered-backend-report.txt'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Policy-Filtered Vulnerability Gate — Frontend Image
        if: success() || failure()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.digest-info.outputs.frontend_candidate }}
          format: 'table'
          output: 'policy-filtered-frontend-report.txt'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      # -------------------------------------------------------------
      # 3. Container SBOM Generation (CycloneDX)
      # -------------------------------------------------------------
      - name: Generate Backend Container CycloneDX SBOM
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.digest-info.outputs.backend_candidate }}
          format: 'cyclonedx'
          output: 'sbom-backend-container.cdx.json'

      - name: Generate Frontend Container CycloneDX SBOM
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.digest-info.outputs.frontend_candidate }}
          format: 'cyclonedx'
          output: 'sbom-frontend-container.cdx.json'

      # -------------------------------------------------------------
      # 4. Display Scan Reports in Job Summary & Console
      # -------------------------------------------------------------
      - name: Display Scan Reports in Job Log & Step Summary
        if: always()
        run: |
          echo "## 🛡️ Container Vulnerability Scan & Dual Reporting Summary" >> $GITHUB_STEP_SUMMARY
          echo "Candidate Backend: \`${{ steps.digest-info.outputs.backend_candidate }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Candidate Frontend: \`${{ steps.digest-info.outputs.frontend_candidate }}\`" >> $GITHUB_STEP_SUMMARY

          if [ -f unfiltered-backend-report.txt ]; then
            echo "### Backend Unfiltered Report" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat unfiltered-backend-report.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "=================== UNFILTERED BACKEND REPORT ==================="
            cat unfiltered-backend-report.txt
          fi

          if [ -f policy-filtered-backend-report.txt ]; then
            echo "### Backend Policy-Filtered Report" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat policy-filtered-backend-report.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "=================== POLICY-FILTERED BACKEND REPORT ==================="
            cat policy-filtered-backend-report.txt
          fi

          if [ -f unfiltered-frontend-report.txt ]; then
            echo "### Frontend Unfiltered Report" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat unfiltered-frontend-report.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "=================== UNFILTERED FRONTEND REPORT ==================="
            cat unfiltered-frontend-report.txt
          fi

          if [ -f policy-filtered-frontend-report.txt ]; then
            echo "### Frontend Policy-Filtered Report" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat policy-filtered-frontend-report.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "=================== POLICY-FILTERED FRONTEND REPORT ==================="
            cat policy-filtered-frontend-report.txt
          fi

      # -------------------------------------------------------------
      # 5. Retain Artifacts (Dual Reports + Container SBOMs)
      # -------------------------------------------------------------
      - name: Upload Vulnerability Scan & SBOM Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-and-sbom-reports
          path: |
            unfiltered-backend-report.txt
            unfiltered-frontend-report.txt
            policy-filtered-backend-report.txt
            policy-filtered-frontend-report.txt
            sbom-backend-container.cdx.json
            sbom-frontend-container.cdx.json
          if-no-files-found: ignore
          retention-days: 30

  # =================================================================
  # Step 4: Promote Verified Images to 'latest' and SemVer Tags
  # Strictly depends on security-scan passing. Never runs on failure.
  # Promotes the exact scanned image digest to latest.
  # =================================================================
  promote-images:
    name: Promote Verified Image Digests to Latest
    needs: [build-and-push-backend, build-and-push-frontend, security-scan]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote Backend Verified Digest to Latest
        run: |
          SRC_DIGEST="${{ needs.build-and-push-backend.outputs.image_name }}@${{ needs.build-and-push-backend.outputs.digest }}"
          TARGET_LATEST="${{ needs.build-and-push-backend.outputs.image_name }}:latest"
          echo "Pulling verified digest: ${SRC_DIGEST}"
          docker pull "${SRC_DIGEST}"
          docker tag "${SRC_DIGEST}" "${TARGET_LATEST}"
          docker push "${TARGET_LATEST}"

      - name: Promote Frontend Verified Digest to Latest
        run: |
          SRC_DIGEST="${{ needs.build-and-push-frontend.outputs.image_name }}@${{ needs.build-and-push-frontend.outputs.digest }}"
          TARGET_LATEST="${{ needs.build-and-push-frontend.outputs.image_name }}:latest"
          echo "Pulling verified digest: ${SRC_DIGEST}"
          docker pull "${SRC_DIGEST}"
          docker tag "${SRC_DIGEST}" "${TARGET_LATEST}"
          docker push "${TARGET_LATEST}"

      - name: Emit Release Provenance Summary
        run: |
          echo "## 🚀 Verified Image Digest Promotion Record" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact | Target Promotion | Verified Immutable Source Digest |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Backend** | \`${{ needs.build-and-push-backend.outputs.image_name }}:latest\` | \`${{ needs.build-and-push-backend.outputs.image_name }}@${{ needs.build-and-push-backend.outputs.digest }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Frontend** | \`${{ needs.build-and-push-frontend.outputs.image_name }}:latest\` | \`${{ needs.build-and-push-frontend.outputs.image_name }}@${{ needs.build-and-push-frontend.outputs.digest }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Promotion Status**: ✅ PROMOTED (Passed all unit tests, candidate builds, and dual Trivy security scans)." >> $GITHUB_STEP_SUMMARY
