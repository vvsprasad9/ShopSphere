name: Docker Build & GHCR Publish

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # =================================================================
  # Pre-requisite Quality Gates: Run backend & frontend test suites
  # =================================================================
  test-backend:
    name: Backend Test Quality Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shopsphere/backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Execute Backend Tests
        run: mvn clean test -B

  test-frontend:
    name: Frontend Test Quality Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shopsphere/frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: shopsphere/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Execute Frontend Tests
        run: npm test

  # =================================================================
  # Build and Publish Spring Boot Backend Docker Image
  # =================================================================
  build-and-push-backend:
    name: Build & Publish Backend Image
    needs: test-backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve Lowercase Repository Name
        id: repo-info
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image_name=ghcr.io/${OWNER_LC}/shopsphere-backend" >> $GITHUB_OUTPUT

      - name: Extract Docker Metadata for Backend
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.repo-info.outputs.image_name }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Log in to GitHub Container Registry
        # Only log in on push/tag events, never on unauthenticated pull requests
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./shopsphere/backend
          file: ./shopsphere/backend/Dockerfile
          # Push strictly on approved push/tag events; pull requests only validate the build
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =================================================================
  # Build and Publish React + Nginx Frontend Docker Image
  # =================================================================
  build-and-push-frontend:
    name: Build & Publish Frontend Image
    needs: test-frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve Lowercase Repository Name
        id: repo-info
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image_name=ghcr.io/${OWNER_LC}/shopsphere-frontend" >> $GITHUB_OUTPUT

      - name: Extract Docker Metadata for Frontend
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.repo-info.outputs.image_name }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./shopsphere/frontend
          file: ./shopsphere/frontend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =================================================================
  # Security Vulnerability Scan (Trivy)
  # =================================================================
  security-scan:
    name: Container Vulnerability Scan
    needs: [build-and-push-backend, build-and-push-frontend]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Lowercase Repository Name
        id: repo-info
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "backend_image=ghcr.io/${OWNER_LC}/shopsphere-backend:latest" >> $GITHUB_OUTPUT
          echo "frontend_image=ghcr.io/${OWNER_LC}/shopsphere-frontend:latest" >> $GITHUB_OUTPUT

      - name: Run Trivy Vulnerability Scanner on Backend Image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.repo-info.outputs.backend_image }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy Vulnerability Scanner on Frontend Image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.repo-info.outputs.frontend_image }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
