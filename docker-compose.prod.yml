# ===================================================================
# ShopSphere - Production GHCR Deployment Compose
# ===================================================================
# Used on production hosts to deploy pre-built container images
# published by GitHub Actions to GitHub Container Registry (ghcr.io).
#
# USAGE:
#   1. Set IMAGE_TAG in .env (e.g. IMAGE_TAG=sha-abc1234 or v1.0.0)
#   2. Authenticate: echo $GHCR_TOKEN | docker login ghcr.io -u $GHCR_USER --password-stdin
#   3. Pull images:  docker compose -f docker-compose.prod.yml pull
#   4. Deploy stack: docker compose -f docker-compose.prod.yml up -d
# ===================================================================

services:
  # -----------------------------------------------------------------
  # 1. MySQL 8 Database Service
  # -----------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: shopsphere-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=caching_sha2_password
    environment:
      MYSQL_DATABASE: ${DB_NAME:-shopsphere_db}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
      MYSQL_USER: ${DB_USERNAME:-shopsphere_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # -----------------------------------------------------------------
  # 2. Spring Boot Backend Service (Pulled from GHCR)
  # -----------------------------------------------------------------
  backend:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_REPO:-shopsphere}/shopsphere-backend:${IMAGE_TAG:-latest}
    container_name: shopsphere-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-shopsphere_db}
      DB_USERNAME: ${DB_USERNAME:-shopsphere_user}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-20}
      DB_POOL_MIN_IDLE: ${DB_POOL_MIN_IDLE:-10}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-604800000}
      APP_PAYMENT_MOCK_ENABLED: "false"
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      ADMIN_FIRST_NAME: ${ADMIN_FIRST_NAME:-System}
      ADMIN_LAST_NAME: ${ADMIN_LAST_NAME:-Admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@shopsphere.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set}
      APP_UPLOAD_DIR: /app/uploads
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      JAVA_OPTS: ${JAVA_OPTS:--XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=50.0 -Djava.security.egd=file:/dev/./urandom}
    volumes:
      - uploads_data:/app/uploads
    networks:
      - edge
      - data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 45s

  # -----------------------------------------------------------------
  # 3. React Frontend & Nginx Reverse Proxy Service (Pulled from GHCR)
  # -----------------------------------------------------------------
  frontend:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_REPO:-shopsphere}/shopsphere-frontend:${IMAGE_TAG:-latest}
    container_name: shopsphere-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:8080"
    networks:
      - edge
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s

# ===================================================================
# Network Isolation
# ===================================================================
networks:
  edge:
    driver: bridge
  data:
    driver: bridge
    internal: true

# ===================================================================
# Persistent Volumes (Preserved across deployments)
# ===================================================================
volumes:
  mysql_data:
    name: shopsphere_mysql_data
  uploads_data:
    name: shopsphere_uploads_data
