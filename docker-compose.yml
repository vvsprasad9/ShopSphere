# ===================================================================
# ShopSphere - Production Docker Compose Orchestration
# ===================================================================
# Multi-container production stack for ShopSphere E-Commerce:
#   - mysql:    MySQL 8.0 RDBMS (isolated in internal data network)
#   - backend:  Spring Boot 3.3.4 (Java 21 JRE, REST API & Business Logic)
#   - frontend: Nginx 1.27 serving React 18 SPA & Reverse Proxy
#
# Usage:
#   1. Copy .env.example to .env and configure production credentials
#   2. Validate syntax: docker compose config
#   3. Start stack:     docker compose up -d
#   4. Check status:    docker compose ps
#   5. View logs:       docker compose logs -f
# ===================================================================

services:
  # -----------------------------------------------------------------
  # 1. MySQL 8 Database Service
  # -----------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: shopsphere-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=caching_sha2_password
    environment:
      MYSQL_DATABASE: ${DB_NAME:-shopsphere_db}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
      MYSQL_USER: ${DB_USERNAME:-shopsphere_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # -----------------------------------------------------------------
  # 2. Spring Boot Backend Service (Java 21 LTS)
  # -----------------------------------------------------------------
  backend:
    build:
      context: ./shopsphere/backend
      dockerfile: Dockerfile
    container_name: shopsphere-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-shopsphere_db}
      DB_USERNAME: ${DB_USERNAME:-shopsphere_user}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-20}
      DB_POOL_MIN_IDLE: ${DB_POOL_MIN_IDLE:-10}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-604800000}
      APP_PAYMENT_MOCK_ENABLED: "false"
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      ADMIN_FIRST_NAME: ${ADMIN_FIRST_NAME:-System}
      ADMIN_LAST_NAME: ${ADMIN_LAST_NAME:-Admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@shopsphere.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set}
      APP_UPLOAD_DIR: /app/uploads
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      JAVA_OPTS: ${JAVA_OPTS:--XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=50.0 -Djava.security.egd=file:/dev/./urandom}
    volumes:
      - uploads_data:/app/uploads
    networks:
      - edge
      - data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 45s

  # -----------------------------------------------------------------
  # 3. React Frontend & Nginx Reverse Proxy Service
  # -----------------------------------------------------------------
  frontend:
    build:
      context: ./shopsphere/frontend
      dockerfile: Dockerfile
    container_name: shopsphere-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:8080"
    networks:
      - edge
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s

# ===================================================================
# Networks: Segmented for Tier Isolation & External Access
# ===================================================================
networks:
  # Edge network: Public-facing ingress; connects Frontend to Backend reverse proxy.
  # Standard bridge allows outbound internet access from backend for Razorpay API.
  edge:
    driver: bridge

  # Data network: Strict internal network isolating MySQL from external and frontend access.
  # Frontend container is NOT attached to this network.
  data:
    driver: bridge
    internal: true

# ===================================================================
# Persistent Named Volumes
# ===================================================================
volumes:
  mysql_data:
    name: shopsphere_mysql_data
  uploads_data:
    name: shopsphere_uploads_data
