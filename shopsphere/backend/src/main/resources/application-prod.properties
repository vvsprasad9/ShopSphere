# ===================================================================
# ShopSphere Production Configuration (Properties Format)
# Profile: prod
# ===================================================================

# Database Configuration (Environment-Based)
spring.datasource.url=jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:shopsphere_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:10}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=ShopSphereProdHikariPool

# JPA / Hibernate Production Settings (Strict Validation, No Auto-Ddl Mutation)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Server Security & Information Masking
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

# Actuator Endpoints (Restricted Non-Sensitive Operations)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true

# Disable Development Documentation in Production by Default
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# Production Logging Configuration
logging.level.root=WARN
logging.level.com.shopsphere=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# Application Specific Properties
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# Payment Gateway (Mock Gateway Strictly Disabled in Production)
app.payment.mock-enabled=false
app.payment.razorpay.key-id=${RAZORPAY_KEY_ID}
app.payment.razorpay.key-secret=${RAZORPAY_KEY_SECRET}
app.payment.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET}

# System Admin Initial Account
app.admin.first-name=${ADMIN_FIRST_NAME:System}
app.admin.last-name=${ADMIN_LAST_NAME:Admin}
app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}

# Upload Storage Directory
app.upload.dir=${APP_UPLOAD_DIR:/app/uploads}
