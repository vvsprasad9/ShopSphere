# ===================================================================
# ShopSphere - Production Nginx Server Configuration
# ===================================================================
# Multi-stage production web server for React SPA and reverse proxy
# Configured for unprivileged non-root execution (user: nginx)
# ===================================================================

worker_processes auto;
pid /tmp/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Unprivileged temporary paths writable by non-root nginx user
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Security: Hide Nginx server version in response headers
    server_tokens off;

    # Client Request & Upload Limits (matches Spring Boot multipart 10MB)
    client_max_body_size 10M;
    client_body_timeout 30s;
    client_header_timeout 30s;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # Map for WebSocket Connection Header Upgrade
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        # Unprivileged port inside container; mapped to host port 80 via Docker Compose
        listen 8080 default_server;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html index.htm;

        # Include centralized security headers
        include /etc/nginx/security-headers.conf;

        # -----------------------------------------------------------------
        # 1. Reverse Proxy for Spring Boot Backend API
        # -----------------------------------------------------------------
        # Preserves original /api/v1/... path verbatim
        location /api/ {
            proxy_pass http://backend:8080;
            proxy_http_version 1.1;

            # Proxy Headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;

            # Proxy Timeouts suitable for file uploads and long-running queries
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Buffering configuration
            proxy_buffering on;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;

            # Intercept gateway failures (502/503/504) to return clean JSON
            proxy_intercept_errors on;
            error_page 502 503 504 = @api_gateway_error;

            # Security headers re-applied in location block
            include /etc/nginx/security-headers.conf;
        }

        # JSON error handler when Spring Boot backend is unreachable
        location @api_gateway_error {
            default_type application/json;
            include /etc/nginx/security-headers.conf;
            return 502 '{"status":502,"message":"Backend service temporarily unavailable. Please try again shortly.","timestamp":"$time_iso8601"}';
        }

        # -----------------------------------------------------------------
        # 2. Vite Bundled Hashed Assets (Long-Lived Immutable Cache)
        # -----------------------------------------------------------------
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            include /etc/nginx/security-headers.conf;
            # Missing assets under /assets/ MUST return 404, never index.html
            try_files $uri =404;
        }

        # -----------------------------------------------------------------
        # 3. Static Media, Fonts & Favicons (Appropriate Caching)
        # -----------------------------------------------------------------
        location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|svg|woff2?|eot|ttf|otf)$ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800, no-transform";
            include /etc/nginx/security-headers.conf;
            # Missing static files MUST return 404, never index.html
            try_files $uri =404;
        }

        # -----------------------------------------------------------------
        # 4. index.html - Never Cache to Guarantee Instant Deployments
        # -----------------------------------------------------------------
        location = /index.html {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            add_header Pragma "no-cache";
            include /etc/nginx/security-headers.conf;
            try_files $uri =404;
        }

        # -----------------------------------------------------------------
        # 5. SPA Client-Side Routing Fallback
        # -----------------------------------------------------------------
        # Direct navigation to /catalog, /products/:id, /admin/analytics, etc.
        location / {
            include /etc/nginx/security-headers.conf;
            try_files $uri $uri/ /index.html;
        }

        # -----------------------------------------------------------------
        # 6. Custom Branded Error Pages
        # -----------------------------------------------------------------
        error_page 404 /404.html;
        location = /404.html {
            root /usr/share/nginx/html;
            include /etc/nginx/security-headers.conf;
            internal;
        }

        error_page 413 /413.html;
        location = /413.html {
            root /usr/share/nginx/html;
            include /etc/nginx/security-headers.conf;
            internal;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
            include /etc/nginx/security-headers.conf;
            internal;
        }
    }
}
