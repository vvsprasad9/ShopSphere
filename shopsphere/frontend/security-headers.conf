# ===================================================================
# ShopSphere - Production HTTP Security Headers
# ===================================================================
# Applied consistently across all locations to prevent header dropping
# ===================================================================

# Prevent MIME-type sniffing
add_header X-Content-Type-Options "nosniff" always;

# Protect against clickjacking (allow framing only by the same origin)
add_header X-Frame-Options "SAMEORIGIN" always;

# Legacy XSS protection for older user agents
add_header X-XSS-Protection "1; mode=block" always;

# Referrer Policy: Send full referrer to same origin, omit path across origins
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Permissions Policy: Restrict sensitive hardware features, allow payment for self & Razorpay
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self \"https://checkout.razorpay.com\")" always;

# Content Security Policy (CSP):
# - script-src: 'self', 'unsafe-inline' (React/Vite), https://checkout.razorpay.com
# - style-src: 'self', 'unsafe-inline' (Tailwind CSS, dynamic runtime styles)
# - img-src: 'self', data:, https: (product media / CDNs), blob:
# - font-src: 'self', data:
# - connect-src: 'self', https://api.razorpay.com, https://lumberjack.razorpay.com
# - frame-src: 'self', https://api.razorpay.com, https://checkout.razorpay.com
# - frame-ancestors: 'self'
# - object-src: 'none'
# - base-uri: 'self'
# - form-action: 'self', https://api.razorpay.com
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://checkout.razorpay.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; font-src 'self' data:; connect-src 'self' https://api.razorpay.com https://lumberjack.razorpay.com; frame-src 'self' https://api.razorpay.com https://checkout.razorpay.com; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self' https://api.razorpay.com;" always;
